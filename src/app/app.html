<nav class="navbar navbar-expand-lg px-4 verza-navbar" style="backdrop-filter: blur(6px);">
  <!-- 🛍️ Brand -->
  <a class="navbar-brand d-flex align-items-center" routerLink="/">
    <img src="assets/images/verza-logo.svg" alt="Verza Logo" height="35" class="me-2" />
    <span class="fw-semibold">Verza</span>
  </a>

  <!-- 🌍 Right Side -->
  <div class="ms-auto d-flex align-items-center gap-3">
    <!-- 💖 Wishlist -->
    <a class="nav-link" routerLink="/wishlist">
      <i class="bi bi-heart"></i>
      <span class="ms-1">Wishlist</span>
    </a>

    <!-- 🛒 Cart -->
    <a class="nav-link position-relative" routerLink="/cart">
      <i class="bi bi-cart"></i>
      <ng-container *ngIf="cart$ | async as cartList">
        <span
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          *ngIf="cartList.length > 0">
          {{ cartList.length }}
        </span>
      </ng-container>
      <span class="ms-1">Cart</span>
    </a>

    <!-- 🌗 Theme Toggle -->
    <button
      class="btn btn-outline-light btn-sm"
      (click)="toggleTheme()"
      title="Toggle Dark/Light Mode"
      type="button">
      <i [class]="isDarkMode ? 'bi bi-brightness-high' : 'bi bi-moon-stars'"></i>
    </button>

    <!-- 👤 User Dropdown -->
    <ng-container *ngIf="isLoggedIn; else guestLogin">
      <div class="dropdown ms-2">
        <button
          class="btn verza-user-btn d-flex align-items-center"
          type="button"
          id="userDropdown"
          data-bs-toggle="dropdown"
          data-bs-auto-close="outside"
          aria-expanded="false">
          <img
            *ngIf="userPhoto"
            [src]="userPhoto"
            alt="Profile"
            class="verza-avatar rounded-circle me-2" />
          <span class="fw-semibold">{{ userName || 'User' }}</span>
          <i class="bi bi-chevron-down ms-2"></i>
        </button>

        <ul
          class="dropdown-menu dropdown-menu-end verza-dropdown animate__animated animate__fadeIn"
          aria-labelledby="userDropdown">
          <li>
            <button class="dropdown-item" type="button" (click)="goToOrders()">
              <i class="bi bi-box-seam me-2"></i> My Orders
            </button>
          </li>
          <li>
            <button class="dropdown-item" type="button" (click)="goToWishlist()">
              <i class="bi bi-heart me-2"></i> Wishlist
            </button>
          </li>
          <li>
            <button class="dropdown-item" type="button" (click)="goToSettings()">
              <i class="bi bi-gear me-2"></i> Settings
            </button>
          </li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <button class="dropdown-item text-danger fw-semibold" type="button" (click)="logout()">
              <i class="bi bi-box-arrow-right me-2"></i> Logout
            </button>
          </li>
        </ul>
      </div>
    </ng-container>

    <!-- 🔑 Guest Login -->
    <ng-template #guestLogin>
      <a class="btn btn-outline-light btn-sm" routerLink="/login">Login</a>
    </ng-template>
  </div>
</nav>

<!-- 🧭 Route View -->
<router-outlet></router-outlet>
