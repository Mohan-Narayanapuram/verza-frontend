<nav
  class="navbar navbar-expand-lg px-4"
  style="backdrop-filter: blur(6px);"
>
  <a class="navbar-brand d-flex align-items-center" routerLink="/">
    <img
      src="assets/images/verza-logo.svg"
      alt="Verza Logo"
      height="35"
      class="me-2"
    />
    <span class="fw-semibold">Verza</span>
  </a>

  <div class="ms-auto d-flex align-items-center">
    <a class="nav-link" routerLink="/wishlist">
      <i class="bi bi-heart"></i>
      <span class="ms-1">Wishlist</span>
    </a>

    <a class="nav-link position-relative" routerLink="/cart">
      <i class="bi bi-cart"></i>
      <ng-container *ngIf="cart$ | async as cartList">
        <span
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          *ngIf="cartList.length > 0"
        >
          {{ cartList.length }}
        </span>
      </ng-container>
      <span class="ms-1">Cart</span>
    </a>

    <!-- 🌗 Theme Toggle -->
    <button
      class="btn btn-outline-light btn-sm ms-3"
      (click)="toggleTheme()"
      title="Toggle Dark/Light Mode"
    >
      <i [class]="isDarkMode ? 'bi bi-brightness-high' : 'bi bi-moon-stars'"></i>
    </button>

    <!-- 👤 Login/Logout -->
    <a
      *ngIf="!isLoggedIn"
      class="btn btn-outline-light btn-sm ms-3"
      routerLink="/login"
      >Login</a
    >

    <button
      *ngIf="isLoggedIn"
      class="btn btn-verza btn-sm ms-3"
      (click)="logout()"
    >
      Logout
    </button>
  </div>
</nav>

<router-outlet></router-outlet>

<!-- Toast for login required -->
<div
  class="toast-container position-fixed bottom-0 end-0 p-3"
  style="z-index: 9999"
>
  <div
    id="loginToast"
    class="toast text-bg-warning align-items-center border-0 shadow-sm"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body fw-semibold">
        Please log in to access this page.
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        data-bs-dismiss="toast"
        aria-label="Close"
      ></button>
    </div>
  </div>
</div>
