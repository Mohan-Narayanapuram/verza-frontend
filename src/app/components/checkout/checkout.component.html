<div class="container mt-4">
  <h2 class="text-center mb-4">Checkout</h2>

  <form class="col-md-6 mx-auto">
    <div class="mb-3">
      <label class="form-label fw-bold">Full Name</label>
      <input type="text" class="form-control" [(ngModel)]="name" name="name" />
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Shipping Address</label>
      <textarea
        class="form-control"
        rows="3"
        [(ngModel)]="address"
        name="address"
      ></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Payment Method</label>
      <select class="form-select" [(ngModel)]="payment" name="payment">
        <option value="COD">Cash on Delivery</option>
        <option value="Card">Credit/Debit Card</option>
        <option value="UPI">UPI</option>
      </select>
    </div>

    <div class="border p-3 mb-3 bg-light">
      <h5>Order Summary</h5>
      <p>Total items: {{ productService.getCart().length }}</p>
      <p class="fw-bold">Grand Total: ₹{{ total }}</p>
    </div>

    <button type="button" class="btn btn-primary w-100" (click)="placeOrder()">Place Order</button>
  </form>

  <div *ngIf="showToast" class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast show text-bg-success">
      <div class="toast-body">{{ toastMessage }}</div>
    </div>
  </div>
</div>
