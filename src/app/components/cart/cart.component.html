<div class="container mt-4">
  <h2 class="text-center mb-4">Your Cart</h2>

  <!-- Empty Cart Message -->
  <div
    *ngIf="productService.getCart().length === 0"
    class="alert alert-info text-center"
  >
    Your cart is empty.
  </div>

  <!-- Cart Table -->
  <div *ngIf="productService.getCart().length > 0">
    <table class="table table-striped align-middle">
      <thead class="table-dark">
        <tr>
          <th>Product</th>
          <th class="text-end">Price</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of productService.getCart()">
          <td>{{ item.name }}</td>
          <td class="text-end">₹{{ item.price }}</td>
        </tr>
      </tbody>
    </table>

    <div class="mt-3">
      <h4 class="text-end text-success">Total: ₹{{ total }}</h4>

      <div class="text-end mt-3">
        <button class="btn btn-secondary me-2" routerLink="/">
          <i class="bi bi-arrow-left-circle"></i> Continue Shopping
        </button>
        <button class="btn btn-primary" routerLink="/checkout">
          <i class="bi bi-credit-card"></i> Proceed to Checkout
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div
    *ngIf="showToast"
    class="toast-container position-fixed bottom-0 end-0 p-3"
  >
    <div class="toast show text-bg-success">
      <div class="toast-body">{{ toastMessage }}</div>
    </div>
  </div>
</div>
